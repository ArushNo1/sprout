<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Quiz Runner</title>
  <style>
    * { margin: 0; padding: 0; }
    html, body { height: 100%; background: #0a2a16; overflow: hidden; touch-action: none; }
    canvas { display: block; }
  </style>
</head>
<body>
  <script src="kaplay.js"></script>
  <script src="bridge.js"></script>
  <script>
    // QUIZ RUNNER, adapted from Nexus's quizrunner template (ArushNo1/Nexus,
    // nexus-agent/templates/quizrunner.html) for Sprout: portrait for phones,
    // four lanes for four choices, the question pinned at the top, and every
    // answer reported to the play page, which scores it in SpacetimeDB.
    //
    // Answer blocks fall down four lanes. Move into the right one before the
    // row reaches you. Left/right or A/D on a keyboard; tap a lane on a phone.
    const P = Sprout.PALETTE;
    const W = 480, H = 800;
    const C = {
      lives: 3,
      fallTime: 8,          // seconds for a row to reach the player at the start
      minFallTime: 4.5,     // fastest it gets
      speedUp: 0.35,        // seconds shaved off per question
      lanes: 4,
      playerY: H - 90,
      blockH: 150,
      panelH: 170,          // question panel at the top
    };
    const laneW = W / C.lanes;
    const laneX = (i) => laneW * i + laneW / 2;

    kaplay({ width: W, height: H, background: P.bg, letterbox: true, crisp: false, touchToMouse: true,
      pixelDensity: Math.min(3, window.devicePixelRatio || 1) });

    Sprout.questions().then(({ title, questions, answered }) => {
      const firstRun = new Set(answered || []);  // answered on an earlier visit: don't report again

      scene("game", ({ practice }) => {
        let lives = C.lives, score = 0, streak = 0, qi = 0, lane = 1, busy = false;
        const fall = () => Math.max(C.minFallTime, C.fallTime - qi * C.speedUp);

        // Lane stripes
        for (let i = 0; i < C.lanes; i++) {
          add([rect(laneW - 6, H - C.panelH), pos(laneW * i + 3, C.panelH), color(...P.tiles[i]), opacity(0.12), z(0)]);
        }

        // Question panel
        add([rect(W, C.panelH), pos(0, 0), color(...P.card), z(30)]);
        const counter = add([text("", { size: 18, font: Sprout.FONT }), pos(16, 14), color(...P.fill), z(31)]);
        const lifeText = add([text("", { size: 18, font: Sprout.FONT }), pos(W - 16, 14), anchor("topright"), color(...P.wrong), z(31)]);
        const prompt = add([text("", { size: 22, width: W - 32, font: Sprout.FONT, lineSpacing: 4 }), pos(16, 46), color(30, 30, 30), z(31)]);
        const scoreText = add([text("", { size: 20, font: Sprout.FONT }), pos(W / 2, H - 24), anchor("center"), color(...P.card), z(31)]);
        if (practice) add([text("practice run", { size: 16, font: Sprout.FONT }), pos(16, H - 32), color(...P.tan), z(31)]);

        // Player
        const player = add([
          rect(64, 40, { radius: 12 }), pos(laneX(lane), C.playerY), anchor("center"),
          color(...P.card), outline(4, rgb(...P.green)), area(), z(20), "player",
        ]);
        player.add([text("^", { size: 26, font: Sprout.FONT }), anchor("center"), color(...P.green)]);
        const moveTo = (i) => { lane = Math.max(0, Math.min(C.lanes - 1, i)); };
        onKeyPress(["left", "a"], () => moveTo(lane - 1));
        onKeyPress(["right", "d"], () => moveTo(lane + 1));
        onMousePress(() => moveTo(Math.floor(mousePos().x / laneW)));
        onUpdate(() => { player.pos.x = lerp(player.pos.x, laneX(lane), Math.min(1, dt() * 14)); });

        const hud = () => {
          counter.text = `${Math.min(qi + 1, questions.length)} of ${questions.length}`;
          lifeText.text = "♥ ".repeat(lives).trim();
          scoreText.text = `${score.toLocaleString()} pts` + (streak >= 2 ? `  ·  ${streak} in a row` : "");
        };

        function spawnRow() {
          if (qi >= questions.length) return finish(true);
          const q = questions[qi];
          prompt.text = q.prompt;
          hud();
          const speed = (C.playerY - C.panelH) / fall();
          q.choices.forEach((choice, i) => {
            const block = add([
              rect(laneW - 12, C.blockH, { radius: 12 }), pos(laneX(i), C.panelH - C.blockH / 2 + 10),
              anchor("center"), color(...P.tiles[i]), area(), z(10), "block",
              { qi, choice: i, speed },
            ]);
            block.add([text(choice, { size: choice.length > 45 ? 15 : choice.length > 24 ? 17 : 20, width: laneW - 20, align: "center", font: Sprout.FONT }), anchor("center"), color(255, 255, 255)]);
          });
          busy = false;
        }

        onUpdate("block", (b) => { b.pos.y += b.speed * dt(); });

        // A row that slips past (the player sat in an empty lane) costs a life but isn't an answer.
        onUpdate(() => {
          if (busy) return;
          const row = get("block").filter((b) => b.qi === qi);
          if (!row.length || row[0].pos.y < C.playerY + 50) return;
          busy = true;
          resolve(null);
        });

        // The row is resolved when the player meets it: whichever lane they're in is their answer.
        onCollide("player", "block", (_, block) => {
          if (busy || block.qi !== qi) return;
          busy = true;
          resolve(block.choice);
        });

        function resolve(choice) {
          const q = questions[qi];
          const right = choice === q.correct;
          if (choice !== null && !practice && !firstRun.has(qi)) Sprout.answer(qi, choice);
          get("block").forEach((b) => {
            b.speed = 0;
            b.color = b.choice === q.correct ? rgb(...P.right) : rgb(60, 60, 60);
            b.opacity = b.choice === q.correct || b.choice === choice ? 1 : 0.35;
          });
          if (right) {
            streak++;
            score += 1000 + Math.min(500, 100 * Math.max(0, streak - 1));
            flash(rgb(...P.right), 0.3);
            addKaboom(player.pos);
          } else {
            streak = 0;
            lives--;
            shake(10);
            flash(rgb(...P.wrong), 0.3);
          }
          const note = add([
            text(right ? "Correct!" : `Answer: ${q.choices[q.correct]}`, { size: 22, width: W - 40, align: "center", font: Sprout.FONT }),
            pos(W / 2, C.playerY - 150), anchor("center"), color(...(right ? P.right : P.card)), z(40),
          ]);
          hud();
          wait(right ? 0.9 : 2.2, () => {
            destroy(note);
            destroyAll("block");
            qi++;
            if (lives <= 0) return finish(false);
            spawnRow();
          });
        }

        function finish(won) {
          Sprout.done(score, practice);
          go("end", { won, score, practice, reached: qi, total: questions.length });
        }

        hud();
        wait(0.8, spawnRow);
      });

      scene("end", ({ won, score, practice, reached, total }) => {
        add([rect(W - 60, 330, { radius: 24 }), pos(W / 2, H / 2), anchor("center"), color(...P.card)]);
        add([text(won ? "Finish line!" : "Out of lives", { size: 40, font: Sprout.FONT }), pos(W / 2, H / 2 - 110), anchor("center"), color(...P.green)]);
        add([text(`${score.toLocaleString()} points`, { size: 28, font: Sprout.FONT }), pos(W / 2, H / 2 - 50), anchor("center"), color(30, 30, 30)]);
        add([text(won ? `All ${total} questions` : `Made it through ${reached} of ${total}`, { size: 20, font: Sprout.FONT }), pos(W / 2, H / 2 - 10), anchor("center"), color(...P.fill)]);
        add([text(practice ? "Practice run: the board keeps your first run." : "Your first run is on the board.", { size: 16, width: W - 110, align: "center", font: Sprout.FONT }), pos(W / 2, H / 2 + 40), anchor("center"), color(...P.fill)]);
        const again = add([rect(240, 56, { radius: 28 }), pos(W / 2, H / 2 + 110), anchor("center"), color(...P.green), area()]);
        again.add([text("Practice again", { size: 22, font: Sprout.FONT }), anchor("center"), color(...P.card)]);
        again.onClick(() => go("game", { practice: true }));
        onKeyPress("space", () => go("game", { practice: true }));
      });

      go("game", { practice: false });
    });
  </script>
</body>
</html>
