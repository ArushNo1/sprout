name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            mastery/requirements.txt
      - run: pip install -r requirements.txt -r mastery/requirements.txt
      - name: Agent tests
        working-directory: uagents-python
        run: python -m unittest orchestrator.test_routing orchestrator.test_inprocess tutor.test_tutor arcade.test_arcade garden.test_garden curriculum.test_concept_map
      - name: Mastery tests
        run: python -m pytest mastery

  spacetimedb:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spacetimedb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: spacetimedb/package-lock.json
      - run: npm ci
      - run: npm test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
